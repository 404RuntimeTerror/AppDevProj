<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miko Bitar — IT Application Specialist & Full-Stack Web Developer</title>
<meta name="description" content="Miko Bitar builds enterprise HR and attendance systems with PHP, JavaScript, MySQL, SQL Server, Redis and Kafka.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070C1C;--bg2:#0D1530;--ink:#EAF0FF;--mute:#9AA8CC;--gold:#F0C36A;--teal:#4FE0D0;--vio:#7C6CFF;--line:rgba(160,180,255,.18);
--head:"Sora",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.7 var(--body);overflow-x:hidden}
a{color:var(--teal)}:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.08;letter-spacing:-.02em}
p{margin:0 0 1rem}
.wrap{max-width:66rem;margin:0 auto;padding:0 1.5rem;position:relative}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--teal),var(--gold));z-index:20}
header{position:fixed;inset:0 0 auto 0;z-index:10;background:linear-gradient(var(--bg),transparent)}
nav{display:flex;justify-content:space-between;align-items:center;max-width:66rem;margin:0 auto;padding:1rem 1.5rem}
.brand{font:700 1.05rem var(--head);color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:1.5rem;list-style:none;margin:0;padding:0}
nav ul a{color:var(--mute);text-decoration:none;font-size:.92rem;font-weight:500}nav ul a:hover{color:var(--ink)}
@media(max-width:600px){nav ul li:nth-child(-n+2){display:none}}

/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;isolation:isolate}
.layer{position:absolute;will-change:transform;pointer-events:none}
